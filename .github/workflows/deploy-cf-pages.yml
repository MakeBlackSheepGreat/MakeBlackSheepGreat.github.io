name: Deploy VitePress site to Cloudflare Pages

# 与 GitHub Pages 的部署并行：推送到 main 时两个工作流都会跑。
# 未配置 Cloudflare 密钥时本工作流自动跳过，不影响 GitHub Pages 的发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过 Cloudflare Pages 部署::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。配置后本工作流会自动开始部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.check.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Install CJK fonts and Playwright Chromium
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && npx playwright install --with-deps chromium

      - name: Build site
        if: steps.check.outputs.ready == 'true'
        run: pnpm build

      - name: Generate CV PDFs
        run: |
          npx vitepress preview docs --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/make-cv-pdf.mjs

      # 首次运行创建项目；已存在时该步骤会返回错误，忽略即可
      - name: Ensure Pages project exists
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create liteblacksheep --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=liteblacksheep --branch=main
